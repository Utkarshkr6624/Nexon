# =============================================================================
# Alembic configuration — NEXUS backend
# =============================================================================
# Run every command from the `backend/` directory:
#     cd /e/Nexo/backend && alembic upgrade head
#
# NOTE ON `sqlalchemy.url`
#   It is intentionally left EMPTY. Credentials must never live in a file that
#   is tracked by git. `migrations/env.py` injects the real async URL from
#   `app.core.config.get_settings().sqlalchemy_database_uri`, which is assembled
#   from the POSTGRES_* / DATABASE_URL environment variables (see .env.example).
#   Point the migrations at another database by overriding the environment, e.g.
#     DATABASE_URL=postgresql+psycopg://nexus:nexus@localhost:5432/nexus_test \
#       alembic upgrade head
# =============================================================================

[alembic]
# Path to the migration environment, relative to this file.
script_location = migrations

# Makes `import app...` resolve when alembic is invoked from backend/.
prepend_sys_path = .

# Template used by `alembic revision`.
file_template = %%(rev)s_%%(slug)s

# Trim the leading/trailing whitespace of revision messages.
truncate_slug_length = 40

# Enable timestamped .py migration filenames. Off keeps the generated names
# stable and diff-friendly, so it stays off.
revision_environment = false

# Leave blank: env.py owns the URL. See the note above.
sqlalchemy.url =

# Escape '%' when you must define a literal percent sign on the left side of a
# config key, e.g. `foo = %% bar`.
# escape_percent_sign = true

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S